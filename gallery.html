<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Photo Gallery — Uganda Media Centre</title>
  <meta name="description" content="Official photography from Government of Uganda events, briefings and field programmes.">
  <link rel="icon" href="img/coat.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="gallery" data-root=".">
  <a class="skip" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="crumb"><a href="index.html" data-i18n="crumb.home">Home</a> / <span data-i18n="nav.gallery">Photo Gallery</span></p>
        <h1 data-i18n="gal.h1">The official picture.</h1>
        <p class="lede" data-i18n="gal.lede"></p>
      </div>
    </section>
    <section class="hero-slide" data-slider data-interval="5000" aria-label="Gallery slideshow" style="height:56vh;min-height:360px;margin:0 0 28px">
      <a class="slide is-active" href="img/hero-5.jpg" data-lightbox>
        <img src="img/hero-5.jpg" alt="">
        <div class="shade"></div>
        <div class="meta"><span class="kicker" data-i18n="nav.gallery"></span><h2 data-i18n="gal.h1"></h2></div>
      </a>
      <a class="slide" href="img/defence.jpg" data-lightbox>
        <img src="img/defence.jpg" alt="">
        <div class="shade"></div>
        <div class="meta"><span class="kicker" data-i18n="tag.defence"></span><h2 data-i18n="hero.2.t"></h2></div>
      </a>
      <a class="slide" href="img/food.jpg" data-lightbox>
        <img src="img/food.jpg" alt="">
        <div class="shade"></div>
        <div class="meta"><span class="kicker" data-i18n="tag.relief"></span><h2 data-i18n="home.kar.t"></h2></div>
      </a>
      <a class="slide" href="img/president-1.jpg" data-lightbox>
        <img src="img/president-1.jpg" alt="">
        <div class="shade"></div>
        <div class="meta"><span class="kicker">Uganda</span><h2 data-i18n="home.cabinet"></h2></div>
      </a>
      <button class="slide-btn slide-prev" type="button" aria-label="Previous">‹</button>
      <button class="slide-btn slide-next" type="button" aria-label="Next">›</button>
      <div class="slide-dots"></div>
      <div class="slide-bar"><i></i></div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="wrap gallery-grid wide">
        <a href="img/hero-5.jpg" data-lightbox><img src="img/hero-5.jpg" alt="Foundation stone unveiling"></a>
        <a href="img/defence.jpg" data-lightbox><img src="img/defence.jpg" alt="UPDF parade"></a>
        <a href="img/hero-2.jpg" data-lightbox><img src="img/hero-2.jpg" alt="Shooting exercise"></a>
        <a href="img/hero-3.jpg" data-lightbox><img src="img/hero-3.jpg" alt="Outdoor briefing"></a>
        <a href="img/food.jpg" data-lightbox><img src="img/food.jpg" alt="Prime Minister flags off relief"></a>
        <a href="img/president-1.jpg" data-lightbox><img src="img/president-1.jpg" alt="National flag"></a>
        <a href="img/envoys.jpg" data-lightbox><img src="img/envoys.jpg" alt="Credentials ceremony"></a>
        <a href="img/agriculture.jpg" data-lightbox><img src="img/agriculture.jpg" alt="Coffee harvest"></a>
        <a href="img/hospital.jpg" data-lightbox><img src="img/hospital.jpg" alt="Hospital ward"></a>
        <a href="img/explore-banner.jpg" data-lightbox><img src="img/explore-banner.jpg" alt="Officers and officials"></a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
