<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Studio desk — Uganda Media Centre</title>
  <meta name="description" content="UMC studio desk — go live and manage podcast episodes.">
  <link rel="icon" href="img/coat.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="studio" data-root=".">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <p class="kicker-off">Electronic Media</p>
        <h1>Studio desk</h1>
        <p class="lede">Start a live press briefing for the Radio page, then file it with previous podcasts. No login.</p>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="wrap" id="studio-app">
        <div class="panel">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
            <h3 style="margin:0">Live session</h3>
            <span id="live-status" class="pill-off">Off-air</span>
          </div>
          <p class="muted" style="margin:8px 0 14px">Going live updates Radio in this browser. Paste any https audio or stream URL.</p>
          <div class="studio-grid">
            <div>
              <label for="live-show">Show</label>
              <select id="live-show"></select>
            </div>
            <div>
              <label for="live-lang">Language</label>
              <select id="live-lang">
                <option>English</option>
                <option>Luganda</option>
                <option>Kiswahili</option>
              </select>
            </div>
            <div>
              <label for="live-title">On-air title</label>
              <input id="live-title" placeholder="Live press briefing">
            </div>
            <div>
              <label for="live-host">Host</label>
              <input id="live-host" placeholder="Alan Kasujja">
            </div>
          </div>
          <label for="live-audio" style="margin-top:12px;display:block">Stream / audio URL</label>
          <input id="live-audio" placeholder="https://…mp3 or Icecast stream">
          <label for="live-blurb" style="margin-top:12px;display:block">What is this hour about?</label>
          <textarea id="live-blurb" placeholder="Cabinet briefing…"></textarea>
          <label style="display:flex;gap:8px;align-items:center;margin-top:12px">
            <input id="archive-live" type="checkbox" checked style="width:auto">
            When I end live, save it as a previous podcast
          </label>
          <div class="studio-toolbar">
            <button class="btn-gold" type="button" id="go-live">Go live</button>
            <button class="danger" type="button" id="end-live">End live</button>
            <a class="btn-outline" href="radio.html">Open Radio</a>
          </div>
        </div>

        <div class="panel" id="library" style="margin-top:18px">
          <h3>Previous podcasts</h3>
          <form id="ep-form">
            <input type="hidden" id="ep-id">
            <div class="studio-grid">
              <div>
                <label for="ep-show">Show</label>
                <select id="ep-show" required></select>
              </div>
              <div>
                <label for="ep-lang">Language</label>
                <select id="ep-lang">
                  <option>English</option>
                  <option>Luganda</option>
                  <option>Kiswahili</option>
                </select>
              </div>
              <div>
                <label for="ep-title">Episode title</label>
                <input id="ep-title" required placeholder="The National Bulletin — Episode 143">
              </div>
              <div>
                <label for="ep-date">Date</label>
                <input id="ep-date" type="date">
              </div>
              <div>
                <label for="ep-dur">Duration</label>
                <input id="ep-dur" placeholder="32:14">
              </div>
              <div>
                <label for="ep-audio">Audio URL</label>
                <input id="ep-audio" placeholder="https://…mp3">
              </div>
            </div>
            <label for="ep-blurb" style="margin-top:12px;display:block">Details</label>
            <textarea id="ep-blurb" placeholder="What listeners will hear…"></textarea>
            <div class="studio-toolbar">
              <button class="btn-gold" type="submit">Save episode</button>
              <button class="btn-outline" type="button" id="reset-lib">Reset library</button>
            </div>
          </form>
          <div id="ep-admin-list" style="margin-top:18px"></div>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/podcasts.js"></script>
</body>
</html>
